                <span class="p1">P1</span> WASD 移動 · F 射擊 · Shift 超載衝刺 · Q 彈幕風暴 · E 奈米治療 · R 毀滅雷射 · C 蜂群飛彈<br>
                <span class="p2">P2</span> 方向鍵 移動 · Enter 射擊 · L 絕對護盾 · . 冰封領域 · 右Shift 相位轉移 · K 時間牢籠 · M 奇異點<br>

    <!-- 引入外部 JS 作為網站互動，並將遊戲邏輯直接寫在此處以確保可玩性 -->
    <script src="script.js"></script>
    <script>
    // ================= 遊戲主程式 (整合自您提供的原始碼) =================
    (function(){
    'use strict';

    // 基礎設定
    const canvas = document.getElementById('game');
    if(!canvas) return; // 如果不在遊戲頁面則不執行
    const ctx = canvas.getContext('2d');
    const W = 960, H = 600;
    canvas.width = W;
    canvas.height = H;

    // 音效
    let actx = null;
    function initAudio(){
      if (actx) return;
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }
    function sfx(freq, dur, type, vol){
      if (!actx) return;
      try {
        const t = actx.currentTime;
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = type || 'square';
        o.frequency.setValueAtTime(freq, t);
        o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * 0.45), t + dur);
        g.gain.setValueAtTime(vol || 0.04, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(actx.destination);
        o.start(t); o.stop(t + dur + 0.02);
      } catch(e){}
    }

    // 地圖
    const obstacles = [
      {x:440, y:260, w:80,  h:80},
      {x:180, y:90,  w:130, h:26},
      {x:650, y:90,  w:130, h:26},
      {x:180, y:484, w:130, h:26},
      {x:650, y:484, w:130, h:26}
    ];

    // 技能定義
    const SKILLS = {
      overdrive: { key:'ShiftLeft',  alt:'KeyZ',   cd:6.0,  name:'超載衝刺', color:'#3ddcff' },
      barrage:   { key:'KeyQ',       alt:'KeyX',   cd:12.0, name:'彈幕風暴', color:'#7df9ff' },
      nanoheal:  { key:'KeyE',       alt:'KeyV',   cd:16.0, name:'奈米治療', color:'#5dff9e' },
      deathlaser:{ key:'KeyR',       alt:'KeyT',   cd:14.0, name:'毀滅雷射', color:'#ff5df0' },
      swarm:     { key:'KeyC',       alt:'KeyB',   cd:15.0, name:'蜂群飛彈', color:'#ffb347' },
      fortress:  { key:'KeyL',       alt:'Semicolon', cd:14.0, name:'絕對護盾', color:'#ffffff' },
      frostfield:{ key:'Period',     alt:'Comma',  cd:12.0, name:'冰封領域', color:'#8ad8ff' },
      phase:     { key:'ShiftRight', alt:'Numpad0', cd:13.0, name:'相位轉移', color:'#ff9edb' },
      timelock:  { key:'KeyK',       alt:'KeyI',   cd:15.0, name:'時間牢籠', color:'#b07dff' },
      singularity:{ key:'KeyM',      alt:'KeyN',   cd:18.0, name:'奇異點',   color:'#7a3dff' }
    };

    // 玩家
    function mkPlayer(x, y, color, controls, name, skillList){
      const skillState = {};
      for (let i = 0; i < skillList.length; i++){
        const id = skillList[i];
        skillState[id] = {
          cd: 0, maxCd: SKILLS[id].cd, active: 0, activeMax: 0,
          held: false, pending: false, tickTimer: 0, extra: {}
        };
      }
      return {
        x, y, spawnX:x, spawnY:y, r:16, hp:100, maxHp:100,
        color, name, controls, aim:0, cd:0, flash:0, score:0,
        lastMoveX: 0, lastMoveY: 0, slowTimer: 0, timeSlowTimer: 0,
        invulnTimer: 0, phaseTimer: 0, skills: skillState, skillOrder: skillList
      };
    }

    const p1 = mkPlayer(110, 300, '#3ddcff', {
      up:'KeyW', down:'KeyS', left:'KeyA', right:'KeyD', shoot:'KeyF', shootAlt:'Space'
    }, 'P1', ['overdrive', 'barrage', 'nanoheal', 'deathlaser', 'swarm']);

    const p2 = mkPlayer(850, 300, '#ff4d8d', {
      up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight', shoot:'Enter', shootAlt:'Slash'
    }, 'P2', ['fortress', 'frostfield', 'phase', 'timelock', 'singularity']);

    // 實體
    let bullets = []; let particles = []; let missiles = []; let blackholes = []; let beams = []; let frostZones = [];

    // 狀態
    let state = 'countdown'; let countdown = 3.2; let winner = null; let shake = 0;

    // 輸入
    const pressed = new Set(); const pressedKeys = new Set();
    const PREVENT = new Set(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','KeyF','ShiftLeft','ShiftRight','Slash','KeyQ','KeyZ','KeyE','KeyX','KeyV','KeyT','KeyC','KeyB','Period','Comma','Numpad0','KeyL','Semicolon','KeyK','KeyI','KeyM','KeyN']);

    window.addEventListener('keydown', e => {
      initAudio();
      if (PREVENT.has(e.code)) e.preventDefault();
      if (e.key === 'Enter' || e.key === ' ') e.preventDefault();
      pressed.add(e.code);
      if (e.key) pressedKeys.add(e.key);
      if (e.code === 'KeyR' && state !== 'playing') resetRound(true);
    }, { passive: false });
    window.addEventListener('keyup', e => { pressed.delete(e.code); if (e.key) pressedKeys.delete(e.key); });
    window.addEventListener('blur', () => { pressed.clear(); pressedKeys.clear(); });

    function isDown(code, alt){
      if (pressed.has(code)) return true;
      if (alt && pressed.has(alt)) return true;
      if (pressedKeys.has(code)) return true;
      if (alt && pressedKeys.has(alt)) return true;
      return false;
    }

    // 回合控制
    function resetRound(keepScore){
      resetPlayer(p1); resetPlayer(p2);
      if (!keepScore){ p1.score = 0; p2.score = 0; }
      bullets = []; particles = []; missiles = []; blackholes = []; beams = []; frostZones = [];
      state = 'countdown'; countdown = 3.2; winner = null; shake = 0;
      pressed.clear(); pressedKeys.clear();
    }

    function resetPlayer(p){
      p.x = p.spawnX; p.y = p.spawnY; p.hp = p.maxHp; p.cd = 0; p.flash = 0;
      p.lastMoveX = 0; p.lastMoveY = 0; p.slowTimer = 0; p.timeSlowTimer = 0;
      p.invulnTimer = 0; p.phaseTimer = 0;
      for (const id in p.skills){
        const s = p.skills[id];
        s.cd = 0; s.active = 0; s.activeMax = 0; s.held = false;
        s.pending = false; s.tickTimer = 0; s.extra = {};
      }
    }

    // 幾何工具
    function pushOut(p, o){
      const cx = Math.max(o.x, Math.min(p.x, o.x + o.w));
      const cy = Math.max(o.y, Math.min(p.y, o.y + o.h));
      const dx = p.x - cx, dy = p.y - cy;
      const d2 = dx*dx + dy*dy;
      if (d2 > p.r * p.r) return;
      const d = Math.sqrt(d2);
      if (d < 0.0001){
        const L = p.x - o.x, R = o.x + o.w - p.x, T = p.y - o.y, B = o.y + o.h - p.y;
        const m = Math.min(L, R, T, B);
        if (m === L) p.x = o.x - p.r; else if (m === R) p.x = o.x + o.w + p.r;
        else if (m === T) p.y = o.y - p.r; else p.y = o.y + o.h + p.r;
        return;
      }
      const ov = p.r - d;
      p.x += (dx / d) * ov; p.y += (dy / d) * ov;
    }
    function hitsRect(b, o){
      const cx = Math.max(o.x, Math.min(b.x, o.x + o.w));
      const cy = Math.max(o.y, Math.min(b.y, o.y + o.h));
      return Math.hypot(b.x - cx, b.y - cy) < b.r;
    }
    function pointBlocked(x, y, r){
      for (let k = 0; k < obstacles.length; k++){
        const o = obstacles[k];
        const cx = Math.max(o.x, Math.min(x, o.x + o.w));
        const cy = Math.max(o.y, Math.min(y, o.y + o.h));
        if (Math.hypot(x - cx, y - cy) < r) return true;
      }
      return false;
    }
    function hexA(hex, a){
      let h = hex.replace('#', '');
      if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
      const n = parseInt(h, 16);
      return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
    }
    function rr(c, x, y, w, h, r){
      r = Math.max(0, Math.min(r, Math.abs(w)/2, Math.abs(h)/2));
      c.beginPath(); c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
    }

    // 粒子
    function burst(x, y, color, n, spd){
      for (let i = 0; i < n; i++){
        const a = Math.random() * Math.PI * 2; const s = Math.random() * spd;
        const life = 0.22 + Math.random() * 0.45;
        particles.push({ x:x, y:y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: 1 + Math.random()*2.6, life:life, maxLife:life, color:color });
      }
    }
    function updateParticles(dt){
      for (let i = particles.length - 1; i >= 0; i--){
        const q = particles[i]; q.x += q.vx * dt; q.y += q.vy * dt;
        const damp = Math.pow(0.06, dt); q.vx *= damp; q.vy *= damp;
        q.life -= dt; if (q.life <= 0) particles.splice(i, 1);
      }
    }

    // 射擊
    function fireBullet(p, angle, opts){
      opts = opts || {}; const spd = opts.spd || 700;
      let safeDist = p.r + 6; const maxDist = p.r + 18;
      for (let d = p.r + 6; d <= maxDist; d += 2){
        const tx = p.x + Math.cos(angle) * d; const ty = p.y + Math.sin(angle) * d;
        if (!pointBlocked(tx, ty, 6)) safeDist = d;
      }
      const bx = p.x + Math.cos(angle) * safeDist; const by = p.y + Math.sin(angle) * safeDist;
      if (pointBlocked(bx, by, 6)) return;
      bullets.push({ x: bx, y: by, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd, r: opts.r || 5, owner: p, life: 2.5, frost: !!opts.frost, color: opts.color || p.color });
    }
    function fire(p){
      const s = p.skills;
      if (s.barrage && s.barrage.active > 0){
        const a = p.aim + (Math.random() - 0.5) * 0.12;
        fireBullet(p, a, { r: 4, color: '#7df9ff' }); p.flash = Math.max(p.flash, 0.05); return;
      }
      const a = p.aim + (Math.random() - 0.5) * 0.07; fireBullet(p, a); p.flash = 0.07;
      for (let i = 0; i < 4; i++){
        const pa = a + (Math.random() - 0.5) * 1.3; const ps = 60 + Math.random() * 150; const life = 0.16 + Math.random() * 0.12;
        particles.push({ x: p.x + Math.cos(a)*20, y: p.y + Math.sin(a)*20, vx: Math.cos(pa)*ps, vy: Math.sin(pa)*ps, r: 1 + Math.random()*1.6, life: life, maxLife: life, color: p.color });
      }
      sfx(620 + Math.random()*90, 0.055, 'square', 0.022);
    }

    // 傷害
    function damage(target, amt, b, opts){
      opts = opts || {}; if (state === 'over') return; if (target.hp <= 0) return;
      if (target.invulnTimer > 0 || target.phaseTimer > 0){
        const px = b ? b.x : target.x; const py = b ? b.y : target.y;
        burst(px, py, '#ffffff', 8, 140); target.flash = Math.max(target.flash, 0.1); sfx(320, 0.08, 'sine', 0.03); return;
      }
      if (target.skills.fortress && target.skills.fortress.active > 0){
        const px = b ? b.x : target.x; const py = b ? b.y : target.y; const ang = Math.atan2(py - target.y, px - target.x);
        burst(px, py, '#ffffff', 12, 200);
        for (let i = 0; i < 12; i++){
          const a2 = ang + (Math.random() - 0.5) * 1.2; const s = 100 + Math.random() * 160; const life = 0.3 + Math.random() * 0.2;
          particles.push({ x: target.x + Math.cos(ang) * (target.r + 8), y: target.y + Math.sin(ang) * (target.r + 8), vx: Math.cos(a2) * s, vy: Math.sin(a2) * s, r: 1.5 + Math.random() * 3, life: life, maxLife: life, color: '#ffffff' });
        }
        target.flash = Math.max(target.flash, 0.15); sfx(360, 0.12, 'sine', 0.04); return;
      }
      target.hp -= amt; target.flash = 0.25; shake = Math.min(11, shake + 6);
      if (b) burst(b.x, b.y, b.color || target.color, 10, 200); else burst(target.x, target.y, opts.color || target.color, 14, 220);
      sfx(180, 0.16, 'sawtooth', 0.05);
      if (target.hp <= 0){
        target.hp = 0; state = 'over'; winner = (target === p1) ? p2 : p1; winner.score++;
        burst(target.x, target.y, target.color, 46, 340); burst(target.x, target.y, '#ffffff', 18, 220);
        shake = 16; sfx(110, 0.7, 'sawtooth', 0.08); sfx(70, 0.9, 'triangle', 0.07);
      }
    }

    // 技能使用
    function tryUseSkill(p, id){
      const s = p.skills[id]; if (!s || s.cd > 0 || s.active > 0) return;
      const def = SKILLS[id]; const foe = (p === p1) ? p2 : p1;
      if (id === 'overdrive'){ s.active = 0.8; s.activeMax = 0.8; p.invulnTimer = Math.max(p.invulnTimer, 0.8); s.cd = s.maxCd; burst(p.x, p.y, def.color, 24, 300); sfx(900, 0.15, 'sawtooth', 0.05); }
      else if (id === 'barrage'){ s.active = 2.0; s.activeMax = 2.0; s.tickTimer = 0; s.cd = s.maxCd; burst(p.x, p.y, def.color, 16, 200); sfx(720, 0.15, 'square', 0.04); }
      else if (id === 'nanoheal'){ s.active = 4.0; s.activeMax = 4.0; s.tickTimer = 0; s.cd = s.maxCd; burst(p.x, p.y, def.color, 16, 160); sfx(520, 0.25, 'sine', 0.05); }
      else if (id === 'deathlaser'){ s.active = 2.0; s.activeMax = 2.0; s.tickTimer = 0; s.cd = s.maxCd; beams.push({ owner: p, angle: p.aim, x: p.x, y: p.y, life: 2.0, maxLife: 2.0, width: 0, maxWidth: 26, hitTimer: 0, color: def.color }); shake = Math.min(10, shake + 6); sfx(1200, 0.3, 'sawtooth', 0.05); }
      else if (id === 'swarm'){ s.active = 1.5; s.activeMax = 1.5; s.tickTimer = 0; s.extra.wavesLeft = 3; s.extra.waveTimer = 0; s.cd = s.maxCd; burst(p.x, p.y, def.color, 16, 220); sfx(420, 0.2, 'sawtooth', 0.04); }
      else if (id === 'fortress'){ s.active = 2.5; s.activeMax = 2.5; s.cd = s.maxCd; burst(p.x, p.y, '#ffffff', 20, 180); sfx(500, 0.3, 'triangle', 0.05); }
      else if (id === 'frostfield'){ s.active = 3.0; s.activeMax = 3.0; s.cd = s.maxCd; frostZones.push({ x: foe.x, y: foe.y, r: 90, life: 3.0, maxLife: 3.0, owner: p, color: def.color }); burst(foe.x, foe.y, def.color, 20, 200); sfx(560, 0.2, 'sine', 0.04); }
      else if (id === 'phase'){ s.active = 1.5; s.activeMax = 1.5; p.phaseTimer = 1.5; p.invulnTimer = 1.5; s.cd = s.maxCd; burst(p.x, p.y, def.color, 20, 240); sfx(960, 0.2, 'sine', 0.05); }
      else if (id === 'timelock'){ s.active = 2.5; s.activeMax = 2.5; foe.timeSlowTimer = Math.max(foe.timeSlowTimer, 2.5); s.cd = s.maxCd; burst(foe.x, foe.y, def.color, 24, 200); sfx(260, 0.4, 'sine', 0.05); }
      else if (id === 'singularity'){ s.active = 4.0; s.activeMax = 4.0; s.cd = s.maxCd; blackholes.push({ x: foe.x, y: foe.y, life: 4.0, maxLife: 4.0, r: 10, maxR: 80, owner: p, color: def.color, tickTimer: 0 }); burst(foe.x, foe.y, def.color, 24, 220); sfx(140, 0.6, 'sawtooth', 0.05); }
    }

    // 更新：持續型技能
    function updateBeams(dt){
      for (let i = beams.length - 1; i >= 0; i--){
        const bm = beams[i]; bm.life -= dt; bm.hitTimer -= dt;
        const prog = 1 - bm.life / bm.maxLife; bm.width = bm.maxWidth * Math.min(1, prog * 2.5);
        bm.x = bm.owner.x; bm.y = bm.owner.y; bm.angle = bm.owner.aim;
        if (bm.hitTimer <= 0){
          bm.hitTimer = 0.15; const foe = (bm.owner === p1) ? p2 : p1;
          if (foe.hp > 0){
            const dx = foe.x - bm.x, dy = foe.y - bm.y; const dist = Math.hypot(dx, dy);
            const dot = dx * Math.cos(bm.angle) + dy * Math.sin(bm.angle);
            if (dot > 0 && dist > 0){
              const perp = Math.abs(-dx * Math.sin(bm.angle) + dy * Math.cos(bm.angle));
              if (perp < foe.r + bm.width * 0.5) damage(foe, 6, null, { color: bm.color });
            }
          }
        }
        if (bm.life <= 0) beams.splice(i, 1);
      }
    }
    function updateMissiles(dt){
      for (let i = missiles.length - 1; i >= 0; i--){
        const m = missiles[i]; m.life -= dt;
        if (m.target && m.target.hp > 0){
          const desired = Math.atan2(m.target.y - m.y, m.target.x - m.x);
          let diff = desired - m.angle;
          while (diff > Math.PI) diff -= Math.PI * 2; while (diff < -Math.PI) diff += Math.PI * 2;
          m.angle += Math.sign(diff) * Math.min(Math.abs(diff), 5.0 * dt);
        }
        const spd = 360; m.vx = Math.cos(m.angle) * spd; m.vy = Math.sin(m.angle) * spd;
        m.x += m.vx * dt; m.y += m.vy * dt;
        if (Math.random() < 0.7){
          particles.push({ x: m.x, y: m.y, vx: (Math.random() - 0.5) * 40, vy: (Math.random() - 0.5) * 40, r: 1 + Math.random() * 2, life: 0.2, maxLife: 0.2, color: m.color });
        }
        let dead = false;
        if (m.life <= 0 || m.x < -20 || m.x > W + 20 || m.y < -20 || m.y > H + 20) dead = true;
        if (!dead){
          for (let k = 0; k < obstacles.length; k++){
            if (hitsRect(m, obstacles[k])){ burst(m.x, m.y, m.color, 8, 160); dead = true; break; }
          }
        }
        if (!dead){
          const foe = m.target;
          if (foe && foe.hp > 0 && Math.hypot(m.x - foe.x, m.y - foe.y) < foe.r + m.r){
            damage(foe, 8, { x: m.x, y: m.y, color: m.color }); burst(m.x, m.y, m.color, 12, 200); dead = true;
          }
        }
        if (dead) missiles.splice(i, 1);
      }
    }
    function updateBlackholes(dt){
      for (let i = blackholes.length - 1; i >= 0; i--){
        const bh = blackholes[i]; bh.life -= dt; bh.tickTimer += dt;
        if (Math.random() < 0.9){
          const ang = Math.random() * Math.PI * 2; const dist = 40 + Math.random() * 50;
          particles.push({ x: bh.x + Math.cos(ang) * dist, y: bh.y + Math.sin(ang) * dist, vx: -Math.cos(ang) * 180, vy: -Math.sin(ang) * 180, r: 1 + Math.random() * 2, life: 0.3, maxLife: 0.3, color: bh.color });
        }
        const foe = (bh.owner === p1) ? p2 : p1;
        if (foe.hp > 0 && bh.life > 0){
          const dx = bh.x - foe.x, dy = bh.y - foe.y; const d = Math.hypot(dx, dy);
          if (d > 4 && d < 240){
            const oldX = foe.x, oldY = foe.y; const pull = 300 * dt;
            foe.x += (dx / d) * pull; foe.y += (dy / d) * pull;
            foe.x = Math.max(foe.r, Math.min(W - foe.r, foe.x)); foe.y = Math.max(foe.r, Math.min(H - foe.r, foe.y));
            for (let k = 0; k < obstacles.length; k++) pushOut(foe, obstacles[k]);
            if (pointBlocked(foe.x, foe.y, foe.r - 1)){ foe.x = oldX; foe.y = oldY; }
          }
        }
        if (bh.tickTimer >= 0.5 && bh.life > 0){
          bh.tickTimer -= 0.5;
          if (foe.hp > 0 && Math.hypot(bh.x - foe.x, bh.y - foe.y) < 80) damage(foe, 6, null, { color: bh.color });
        }
        if (bh.life <= 0) blackholes.splice(i, 1);
      }
    }
    function updateFrostZones(dt){
      for (let i = frostZones.length - 1; i >= 0; i--){
        const fz = frostZones[i]; fz.life -= dt;
        const foe = (fz.owner === p1) ? p2 : p1;
        if (foe.hp > 0 && Math.hypot(fz.x - foe.x, fz.y - foe.y) < fz.r) foe.slowTimer = Math.max(foe.slowTimer, 0.2);
        if (Math.random() < 0.5){
          const ang = Math.random() * Math.PI * 2; const dist = Math.random() * fz.r;
          particles.push({ x: fz.x + Math.cos(ang) * dist, y: fz.y + Math.sin(ang) * dist, vx: (Math.random() - 0.5) * 40, vy: (Math.random() - 0.5) * 40, r: 1 + Math.random() * 1.5, life: 0.4, maxLife: 0.4, color: fz.color });
        }
        if (fz.life <= 0) frostZones.splice(i, 1);
      }
    }

    // 更新：玩家
    function updatePlayer(p, foe, dt){
      for (let i = 0; i < p.skillOrder.length; i++){
        const id = p.skillOrder[i]; const s = p.skills[id]; const def = SKILLS[id];
        const down = isDown(def.key, def.alt);
        if (down && !s.held) tryUseSkill(p, id); s.held = down;
      }
      for (const id in p.skills){
        const s = p.skills[id];
        if (s.active > 0) s.active = Math.max(0, s.active - dt);
        if (s.cd > 0) s.cd = Math.max(0, s.cd - dt);
      }
      if (p.skills.barrage && p.skills.barrage.active > 0){
        p.skills.barrage.tickTimer += dt;
        while (p.skills.barrage.tickTimer >= 0.12){ p.skills.barrage.tickTimer -= 0.12; fire(p); }
      }
      if (p.skills.nanoheal && p.skills.nanoheal.active > 0){
        p.skills.nanoheal.tickTimer += dt;
        while (p.skills.nanoheal.tickTimer >= 0.5){
          p.skills.nanoheal.tickTimer -= 0.5;
          if (p.hp < p.maxHp){ p.hp = Math.min(p.maxHp, p.hp + 4); burst(p.x, p.y, '#5dff9e', 6, 100); }
        }
      }
      if (p.skills.swarm && p.skills.swarm.active > 0){
        const sw = p.skills.swarm; sw.extra.waveTimer = (sw.extra.waveTimer || 0) + dt;
        if (sw.extra.waveTimer >= 0.5 && sw.extra.wavesLeft > 0){
          sw.extra.waveTimer = 0; sw.extra.wavesLeft--;
          for (let j = 0; j < 2; j++){
            const off = (j - 0.5) * 0.5 + (Math.random() - 0.5) * 0.2;
            missiles.push({ x: p.x + Math.cos(p.aim + off) * 24, y: p.y + Math.sin(p.aim + off) * 24, vx: Math.cos(p.aim + off) * 300, vy: Math.sin(p.aim + off) * 300, angle: p.aim + off, life: 3.0, r: 5, owner: p, target: foe, color: '#ffb347' });
          }
          sfx(460, 0.1, 'square', 0.03);
        }
      }
      if (p.slowTimer > 0) p.slowTimer = Math.max(0, p.slowTimer - dt);
      if (p.timeSlowTimer > 0) p.timeSlowTimer = Math.max(0, p.timeSlowTimer - dt);
      if (p.invulnTimer > 0) p.invulnTimer = Math.max(0, p.invulnTimer - dt);
      if (p.phaseTimer > 0) p.phaseTimer = Math.max(0, p.phaseTimer - dt);
      
      let speedMul = 1; if (p.slowTimer > 0) speedMul *= 0.4; if (p.timeSlowTimer > 0) speedMul *= 0.3;
      const c = p.controls; let dx = 0, dy = 0;
      if (isDown(c.up)) dy -= 1; if (isDown(c.down)) dy += 1;
      if (isDown(c.left)) dx -= 1; if (isDown(c.right)) dx += 1;
      const len = Math.hypot(dx, dy);
      if (len > 0){ dx /= len; dy /= len; p.lastMoveX = dx; p.lastMoveY = dy; }
      
      let spd = 255 * speedMul;
      if (p.skills.overdrive && p.skills.overdrive.active > 0) spd = 765 * speedMul;
      p.x += dx * spd * dt; p.y += dy * spd * dt;
      p.x = Math.max(p.r, Math.min(W - p.r, p.x)); p.y = Math.max(p.r, Math.min(H - p.r, p.y));
      
      if (p.phaseTimer <= 0){ for (let i = 0; i < obstacles.length; i++) pushOut(p, obstacles[i]); }
      p.aim = Math.atan2(foe.y - p.y, foe.x - p.x);
      p.cd -= dt;
      if (isDown(c.shoot, c.shootAlt) && p.cd <= 0){
        fire(p); p.cd = (p.skills.barrage && p.skills.barrage.active > 0) ? 0.12 : 0.34;
      }
    }

    function updateBullets(dt){
      const toRemove = [];
      for (let i = 0; i < bullets.length; i++){
        const b = bullets[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
        let dead = false;
        if (b.life <= 0 || b.x < b.r || b.x > W - b.r || b.y < b.r || b.y > H - b.r) dead = true;
        if (!dead){
          for (let k = 0; k < obstacles.length; k++){
            if (hitsRect(b, obstacles[k])){ burst(b.x, b.y, b.color || b.owner.color, 6, 130); dead = true; break; }
          }
        }
        if (!dead){
          const target = (b.owner === p1) ? p2 : p1;
          if (target.hp > 0 && Math.hypot(b.x - target.x, b.y - target.y) < target.r + b.r){
            damage(target, 12, b); dead = true;
          }
        }
        if (dead) toRemove.push(i);
      }
      for (let i = toRemove.length - 1; i >= 0; i--) bullets.splice(toRemove[i], 1);
    }

    function update(dt){
      if (shake > 0) shake = Math.max(0, shake - dt * 55);
      if (state === 'countdown'){
        countdown -= dt;
        p1.aim = Math.atan2(p2.y - p1.y, p2.x - p1.x); p2.aim = Math.atan2(p1.y - p2.y, p1.x - p2.x);
        if (countdown <= 0){ state = 'playing'; sfx(900, 0.14, 'square', 0.05); }
      } else if (state === 'playing'){
        if (p1.hp > 0 && p2.hp > 0){ updatePlayer(p1, p2, dt); updatePlayer(p2, p1, dt); }
        updateBullets(dt); updateBeams(dt); updateMissiles(dt); updateBlackholes(dt); updateFrostZones(dt);
      }
      updateParticles(dt);
      p1.flash = Math.max(0, p1.flash - dt); p2.flash = Math.max(0, p2.flash - dt);
    }

    // 繪製
    let vignette = null; let vignetteW = 0, vignetteH = 0;
    function drawBackground(){
      ctx.fillStyle = '#0a0e17'; ctx.fillRect(-20, -20, W + 40, H + 40);
      ctx.strokeStyle = 'rgba(70,130,220,0.07)'; ctx.lineWidth = 1; ctx.beginPath();
      for (let x = 0; x <= W; x += 48){ ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
      for (let y = 0; y <= H; y += 48){ ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
      ctx.stroke();
      if (!vignette || vignetteW !== W || vignetteH !== H){
        vignette = ctx.createRadialGradient(W/2, H/2, 140, W/2, H/2, Math.max(W,H) * 0.72);
        vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,0.62)');
        vignetteW = W; vignetteH = H;
      }
      ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
      const ts = Math.max(p1.timeSlowTimer, p2.timeSlowTimer);
      if (ts > 0){ ctx.fillStyle = 'rgba(176,125,255,' + (Math.min(1, ts / 2.5) * 0.12) + ')'; ctx.fillRect(0, 0, W, H); }
      ctx.strokeStyle = 'rgba(90,150,255,0.22)'; ctx.lineWidth = 2; ctx.strokeRect(1, 1, W - 2, H - 2);
    }
    function drawObstacles(){
      for (let i = 0; i < obstacles.length; i++){
        const o = obstacles[i];
        ctx.save(); ctx.shadowColor = 'rgba(80,140,255,0.55)'; ctx.shadowBlur = 18;
        ctx.fillStyle = '#16203a'; rr(ctx, o.x, o.y, o.w, o.h, 6); ctx.fill(); ctx.restore();
        ctx.strokeStyle = 'rgba(110,170,255,0.45)'; ctx.lineWidth = 1.5; rr(ctx, o.x, o.y, o.w, o.h, 6); ctx.stroke();
        ctx.strokeStyle = 'rgba(150,205,255,0.10)'; ctx.lineWidth = 1; rr(ctx, o.x + 3, o.y + 3, o.w - 6, o.h - 6, 4); ctx.stroke();
      }
    }
    function drawPlayer(p){
      if (p.skills.fortress && p.skills.fortress.active > 0){
        const a = Math.min(1, p.skills.fortress.active * 2);
        ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,' + (0.6 * a) + ')'; ctx.lineWidth = 4;
        ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 28; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 15, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      }
      if (p.phaseTimer > 0){
        ctx.save(); ctx.globalAlpha = 0.5; ctx.strokeStyle = 'rgba(255,158,219,0.8)'; ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 10, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      }
      if (p.skills.overdrive && p.skills.overdrive.active > 0){
        let mx = p.lastMoveX, my = p.lastMoveY;
        if (mx === 0 && my === 0){ mx = Math.cos(p.aim); my = Math.sin(p.aim); }
        for (let k = 1; k <= 3; k++){
          ctx.save(); ctx.globalAlpha = 0.35 / k; ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x - mx * 16 * k, p.y - my * 16 * k, p.r * (1 - k * 0.15), 0, Math.PI * 2); ctx.fill(); ctx.restore();
        }
      }
      if (p.slowTimer > 0){
        ctx.save(); ctx.strokeStyle = 'rgba(138,216,255,0.7)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 5, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      }
      if (p.timeSlowTimer > 0){
        ctx.save(); ctx.strokeStyle = 'rgba(176,125,255,0.8)'; ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 9, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      }
      const gg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3.4);
      gg.addColorStop(0, hexA(p.color, 0.42)); gg.addColorStop(1, hexA(p.color, 0));
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3.4, 0, Math.PI * 2); ctx.fill();
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.aim); ctx.fillStyle = hexA(p.color, 0.85);
      rr(ctx, p.r * 0.35, -4.5, p.r * 1.0, 9, 3); ctx.fill(); ctx.restore();
      ctx.save(); ctx.shadowColor = p.color; ctx.shadowBlur = 22; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      ctx.fillStyle = '#eaf6ff'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.44, 0, Math.PI * 2); ctx.fill();
      if (p.flash > 0){
        ctx.strokeStyle = 'rgba(255,255,255,' + Math.min(1, p.flash * 4.5) + ')'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 7, 0, Math.PI * 2); ctx.stroke();
      }
    }
    function drawBeams(){
      for (let i = 0; i < beams.length; i++){
        const bm = beams[i]; const len = 1200; const ex = bm.x + Math.cos(bm.angle) * len; const ey = bm.y + Math.sin(bm.angle) * len;
        const alpha = Math.min(1, bm.life / bm.maxLife * 1.5);
        ctx.save(); ctx.lineCap = 'round'; ctx.shadowColor = bm.color; ctx.shadowBlur = 40;
        ctx.strokeStyle = hexA(bm.color, 0.7 * alpha); ctx.lineWidth = bm.width;
        ctx.beginPath(); ctx.moveTo(bm.x, bm.y); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.shadowBlur = 20; ctx.strokeStyle = 'rgba(255,255,255,' + (0.9 * alpha) + ')'; ctx.lineWidth = bm.width * 0.35;
        ctx.beginPath(); ctx.moveTo(bm.x, bm.y); ctx.lineTo(ex, ey); ctx.stroke(); ctx.restore();
      }
    }
    function drawMissiles(){
      for (let i = 0; i < missiles.length; i++){
        const m = missiles[i]; ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.angle);
        ctx.shadowColor = m.color; ctx.shadowBlur = 20; ctx.fillStyle = m.color;
        ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-6, -5); ctx.lineTo(-3, 0); ctx.lineTo(-6, 5); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }
    }
    function drawBlackholes(){
      for (let i = 0; i < blackholes.length; i++){
        const bh = blackholes[i]; const lifePct = bh.life / bh.maxLife; const radius = bh.maxR * (1 - lifePct * 0.2);
        ctx.save(); const grd = ctx.createRadialGradient(bh.x, bh.y, 0, bh.x, bh.y, radius);
        grd.addColorStop(0, 'rgba(10,0,25,' + (0.95 * lifePct) + ')'); grd.addColorStop(0.4, hexA(bh.color, 0.55 * lifePct)); grd.addColorStop(1, hexA(bh.color, 0));
        ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(bh.x, bh.y, radius, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = hexA(bh.color, 0.8 * lifePct); ctx.lineWidth = 2; ctx.shadowColor = bh.color; ctx.shadowBlur = 25;
        ctx.beginPath(); ctx.arc(bh.x, bh.y, radius * 0.6, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      }
    }
    function drawFrostZones(){
      for (let i = 0; i < frostZones.length; i++){
        const fz = frostZones[i]; const a = fz.life / fz.maxLife;
        ctx.save(); const grd = ctx.createRadialGradient(fz.x, fz.y, 0, fz.x, fz.y, fz.r);
        grd.addColorStop(0, hexA(fz.color, 0.3 * a)); grd.addColorStop(0.7, hexA(fz.color, 0.15 * a)); grd.addColorStop(1, hexA(fz.color, 0));
        ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(fz.x, fz.y, fz.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = hexA(fz.color, 0.6 * a); ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
        ctx.beginPath(); ctx.arc(fz.x, fz.y, fz.r, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      }
    }
    function drawBullets(){
      ctx.lineCap = 'round';
      for (let i = 0; i < bullets.length; i++){
        const b = bullets[i]; const col = b.color || b.owner.color;
        const tx = b.x - b.vx * 0.024; const ty = b.y - b.vy * 0.024;
        const grd = ctx.createLinearGradient(tx, ty, b.x, b.y); grd.addColorStop(0, hexA(col, 0)); grd.addColorStop(1, hexA(col, 0.85));
        ctx.strokeStyle = grd; ctx.lineWidth = b.r * 1.7; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
        ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 14; ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.62, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }
    }
    function drawParticles(){
      for (let i = 0; i < particles.length; i++){
        const q = particles[i]; const a = Math.max(0, q.life / q.maxLife);
        ctx.globalAlpha = a; ctx.fillStyle = q.color; ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(0.3, q.r * a), 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    function drawBar(x, y, w, h, p, fromRight){
      ctx.fillStyle = 'rgba(255,255,255,0.07)'; rr(ctx, x, y, w, h, h/2); ctx.fill();
      const pct = Math.max(0, p.hp / p.maxHp); const fw = w * pct;
      if (fw > 2){
        const bx = fromRight ? x + w - fw : x;
        ctx.save(); ctx.shadowColor = p.color; ctx.shadowBlur = 14; ctx.fillStyle = p.color;
        rr(ctx, bx, y, fw, h, Math.min(h/2, fw/2)); ctx.fill(); ctx.restore();
        ctx.fillStyle = 'rgba(255,255,255,0.22)'; rr(ctx, bx + 3, y + 3, Math.max(0, fw - 6), h/2 - 3, Math.min((h/2-3)/2, Math.max(0, fw-6)/2)); ctx.fill();
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1; rr(ctx, x, y, w, h, h/2); ctx.stroke();
    }
    function drawSkillSlots(x, y, w, p, fromRight){
      const n = p.skillOrder.length; const gap = 5; const slotW = (w - gap * (n - 1)) / n; const slotH = 8;
      for (let i = 0; i < n; i++){
        const id = p.skillOrder[i]; const s = p.skills[id]; const def = SKILLS[id];
        const sx = fromRight ? x + w - slotW - (slotW + gap) * i : x + (slotW + gap) * i;
        ctx.fillStyle = 'rgba(255,255,255,0.08)'; rr(ctx, sx, y, slotW, slotH, 3); ctx.fill();
        let pct = 0;
        if (s.active > 0){
          pct = s.active / s.activeMax; ctx.save(); ctx.shadowColor = def.color; ctx.shadowBlur = 12; ctx.fillStyle = hexA(def.color, 0.9);
          rr(ctx, fromRight ? sx + slotW - slotW * pct : sx, y, slotW * pct, slotH, 3); ctx.fill(); ctx.restore();
        } else {
          pct = 1 - (s.cd / s.maxCd);
          if (pct > 0.01){ ctx.fillStyle = pct >= 1 ? hexA(def.color, 0.9) : hexA(def.color, 0.35); rr(ctx, fromRight ? sx + slotW - slotW * pct : sx, y, slotW * pct, slotH, 3); ctx.fill(); }
        }
        ctx.strokeStyle = (s.active > 0) ? hexA(def.color, 1) : 'rgba(255,255,255,0.15)'; ctx.lineWidth = s.active > 0 ? 2 : 1;
        rr(ctx, sx, y, slotW, slotH, 3); ctx.stroke();
      }
    }
    function drawHUD(){
      const bw = 340, bh = 18, by = 22, m = 28;
      drawBar(m, by, bw, bh, p1, false); drawBar(W - m - bw, by, bw, bh, p2, true);
      drawSkillSlots(m, by + bh + 5, bw, p1, false); drawSkillSlots(W - m - bw, by + bh + 5, bw, p2, true);
      ctx.font = '600 14px system-ui, -apple-system, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = hexA(p1.color, 0.95); ctx.fillText('P1', m, by + bh + 34);
      ctx.fillStyle = '#43536f'; ctx.fillText('WASD · F · Shift/Q/E/R/C', m + 32, by + bh + 34);
      ctx.textAlign = 'right'; ctx.fillStyle = hexA(p2.color, 0.95); ctx.fillText('P2', W - m, by + bh + 34);
      ctx.fillStyle = '#43536f'; ctx.fillText('方向鍵 · Enter · L/./Shift/K/M', W - m - 32, by + bh + 34);
      ctx.textAlign = 'center'; ctx.font = '700 28px system-ui, -apple-system, sans-serif'; ctx.fillStyle = '#7d95bd';
      ctx.fillText(p1.score + ' : ' + p2.score, W / 2, by + bh + 2);
    }
    function drawOverlay(){
      if (state === 'countdown'){
        const n = Math.ceil(countdown); ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '800 150px system-ui, -apple-system, sans-serif'; ctx.fillStyle = 'rgba(225,238,255,0.92)';
        ctx.shadowColor = 'rgba(90,160,255,0.9)'; ctx.shadowBlur = 45; ctx.fillText(n > 0 ? String(n) : 'GO', W / 2, H / 2); ctx.restore();
      }
      if (state === 'over'){
        ctx.fillStyle = 'rgba(5,8,15,0.74)'; ctx.fillRect(0, 0, W, H);
        ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '800 66px system-ui, -apple-system, sans-serif';
        ctx.fillStyle = winner.color; ctx.shadowColor = winner.color; ctx.shadowBlur = 45;
        ctx.fillText(winner.name + ' 勝利', W / 2, H / 2 - 42); ctx.shadowBlur = 0;
        ctx.font = '500 20px system-ui, -apple-system, sans-serif'; ctx.fillStyle = '#8fa8d0';
        ctx.fillText('按 R 再來一場', W / 2, H / 2 + 52); ctx.restore();
      }
    }
    function render(){
      ctx.fillStyle = '#0a0e17'; ctx.fillRect(0, 0, W, H); drawBackground();
      ctx.save(); if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      drawObstacles(); drawFrostZones(); drawParticles(); drawBlackholes(); drawBeams(); drawBullets(); drawMissiles();
      drawPlayer(p2); drawPlayer(p1); ctx.restore(); drawHUD(); drawOverlay();
    }
    
    let lastT = performance.now();
    function loop(now){
      let dt = (now - lastT) / 1000; lastT = now;
      if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
      update(dt); render(); requestAnimationFrame(loop);
    }
    resetRound(false); requestAnimationFrame(loop);
    })();
    </script>
